name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies (locked)
        run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Unit and sync tests
        run: bun run test -- --exclude "e2e/**" --exclude "src/test/app-routing.test.tsx"