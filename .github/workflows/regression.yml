name: Regression (all apps, all screen sizes)

on:
  workflow_dispatch:
    inputs:
      live_order:
        description: "Also place one clearly-marked test guest order on the live POS"
        type: boolean
        default: false
      base_url:
        description: "Test this site instead of a local build (e.g. https://good-times-start.lovable.app)"
        type: string
        default: ""
      grep:
        description: "Only run checks whose name matches (e.g. Sync window)"
        type: string
        default: ""
  pull_request:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

# The regression workflow only needs to read the repository.
# Reports are uploaded as artifacts; it must not create/push result branches.
permissions:
  contents: read

jobs:
  e2e:
    # Pin to a Playwright-supported runner image; ubuntu-latest moved to 26.04,
    # which Playwright 1.56 does not support yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install app
        run: bun install --frozen-lockfile || bun install
      - name: Check E2E Supabase configuration
        id: e2e_config
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated browser regression is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping authenticated browser regression: configure VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY repository Actions secrets to enable it."
          fi
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Install Playwright (test-only, not saved)
        if: steps.e2e_config.outputs.enabled == 'true'
        timeout-minutes: 15
        run: |
          bun add -d @playwright/test@1.56.0 jsqr@1.4.0 pngjs@7.0.0 @types/pngjs@6.0.5
          bunx playwright install --with-deps chromium
      - name: Production build
        run: bunx vite build
        env:
          # Build-only placeholders; authenticated browser tests use real secrets.
          VITE_SUPABASE_URL: https://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: e2e-build-placeholder
      - name: Unit and sync tests
        run: bunx vitest run --exclude "e2e/**" --exclude "src/test/app-routing.test.tsx"
      - name: Browser regression
        if: steps.e2e_config.outputs.enabled == 'true'
        run: |
          set -o pipefail
          bunx playwright test -c e2e/regression.config.ts ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }} 2>&1 | tee e2e-log.txt
        env:
          XTSY_ADMIN_PASSWORD: ${{ secrets.XTSY_ADMIN_PASSWORD }}
          XTSY_BILLDESK_PASSWORD: ${{ secrets.XTSY_BILLDESK_PASSWORD }}
          XTSY_WAITER_PASSWORD: ${{ secrets.XTSY_WAITER_PASSWORD }}
          LIVE_ORDER: ${{ inputs.live_order && '1' || '' }}
          BASE_URL: ${{ inputs.base_url }}
          # First-time sign-in must reach the real Supabase Auth + database APIs.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Report skipped browser regression
        if: steps.e2e_config.outputs.enabled != 'true'
        run: echo "Authenticated Playwright tests were skipped because Supabase Actions secrets are not configured. Unit/sync tests and build still ran." >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always() && steps.e2e_config.outputs.enabled == 'true'
        run: |
          if [ -f e2e-results.json ]; then
            node e2e/summary.mjs > summary.md || echo "Could not generate summary." > summary.md
            node e2e/extract.mjs || true
          else
            echo "No Playwright results were produced (setup or test execution failed)." > summary.md
          fi
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            e2e-report
            e2e-results.json
            e2e-out
            e2e-log.txt
            summary.md
          if-no-files-found: ignore
          retention-days: 14
