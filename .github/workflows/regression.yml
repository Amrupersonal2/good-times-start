name: Regression (all apps, all screen sizes)

on:
  workflow_dispatch:
    inputs:
      live_order:
        description: "Also place one clearly-marked test guest order on the live POS"
        type: boolean
        default: false
  pull_request:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install app
        run: bun install --frozen-lockfile || bun install
      - name: Install Playwright (test-only, not saved)
        run: |
          bun add -d @playwright/test@1.56.0
          bunx playwright install --with-deps chromium
      - name: Production build
        run: bunx vite build
      - name: Unit and sync tests
        run: bunx vitest run --exclude "e2e/**" --exclude "src/test/app-routing.test.tsx"
        continue-on-error: true
      - name: Browser regression
        run: bunx playwright test -c e2e/regression.config.ts
        env:
          XTSY_ADMIN_PASSWORD: ${{ secrets.XTSY_ADMIN_PASSWORD }}
          XTSY_BILLDESK_PASSWORD: ${{ secrets.XTSY_BILLDESK_PASSWORD }}
          XTSY_WAITER_PASSWORD: ${{ secrets.XTSY_WAITER_PASSWORD }}
          LIVE_ORDER: ${{ inputs.live_order && '1' || '' }}
      - name: Summary
        if: always()
        run: |
          node e2e/summary.mjs > summary.md || echo "No results were produced." > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          node e2e/extract.mjs || true
      - name: Publish results to a branch (readable without downloading artifacts)
        if: always()
        run: |
          mkdir -p /tmp/out && cp summary.md /tmp/out/ && cp -r e2e-out/* /tmp/out/ 2>/dev/null || true
          git config user.name "regression-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "regression/run-${GITHUB_RUN_ID}"
          git rm -rf -q . && git clean -fdq -e node_modules
          cp -r /tmp/out/* .
          git add -A
          git commit -qm "Regression results for ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -q origin "regression/run-${GITHUB_RUN_ID}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            e2e-report
            e2e-results.json
          retention-days: 14
